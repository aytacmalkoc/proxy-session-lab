[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-session-lab"
version = "0.3.0"
description = "Bounded proxy diagnostics with Go TLS profiles and isolated browser validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright==1.64.1", "psutil==7.2.2"]

[project.scripts]
proxy-session-lab = "proxy_session_lab.app:main"

[tool.setuptools]
packages = ["proxy_session_lab"]
